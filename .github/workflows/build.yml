name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    # Ubuntu's GTK and libadwaita are older than Morph needs; Arch has current ones.
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 libadwaita libvips ffmpeg

      - uses: actions/checkout@v7

      - name: Build and test the package
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "makepkg -f --noconfirm"

      - uses: actions/upload-artifact@v7
        with:
          name: morph-converter
          path: '*.pkg.tar.zst'

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: '*.pkg.tar.zst'
